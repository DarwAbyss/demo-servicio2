<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1E3A8A" />
    <title>Bella Vita Studio</title>
    
    <!-- Open Graph Meta Tags para WhatsApp y redes sociales -->
    <meta property="og:title" content="Bella Vita Studio" data-og-title />
    <meta property="og:description" content="Belleza y bienestar en cada detalle" data-og-description />
    <meta property="og:image" content="/assets/hero.png" data-og-image />
    <meta property="og:url" content="" data-og-url />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bella Vita Studio" data-og-site-name />
    
    <!-- Twitter Card (opcional, para mejor compatibilidad) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bella Vita Studio" data-twitter-title />
    <meta name="twitter:description" content="Belleza y bienestar en cada detalle" data-twitter-description />
    <meta name="twitter:image" content="/assets/hero.png" data-twitter-image />
    
    <!-- Fuentes de Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- Tailwind CSS CDN y Configuración -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Open Sans"', 'sans-serif'],
            },
            colors: {
              navy: '#1e3a8a',
              emerald: '#10b981',
              emeraldHover: '#0ea371',
              bgAlt: '#f9fafb',
            }
          }
        }
      }
    </script>
  </head>
  
  <body class="bg-white text-gray-900 font-sans antialiased">
    
    <!-- Header -->
    <header class="sticky top-0 z-40 bg-white border-b border-gray-200">
      <div class="flex items-center gap-3 px-5 py-3 max-w-4xl mx-auto">
        <img class="w-10 h-10 rounded-lg object-cover shrink-0" data-logo alt="Logo" />
        <div class="flex flex-col min-w-0">
          <span class="font-bold text-base text-navy truncate" data-nombre></span>
          <span class="text-xs text-gray-500 truncate" data-eslogan></span>
        </div>
      </div>
    </header>

    <main>
      <!-- Hero Section -->
      <section class="relative h-[46vh] min-h-[280px] max-h-[460px]">
        <img class="w-full h-full object-cover" data-hero-img alt="Hero" />
        <div class="absolute inset-0 bg-gradient-to-t from-slate-900/75 via-slate-900/35 to-transparent"></div>
        <div class="absolute inset-0 flex flex-col justify-end items-start px-5 pb-8 max-w-4xl mx-auto text-white">
          <h1 class="text-3xl sm:text-4xl font-bold mb-2 drop-shadow-md" data-nombre></h1>
          <p class="text-[0.95rem] text-gray-100 mb-4 max-w-sm" data-eslogan></p>
          <button id="cta-scroll" class="inline-flex items-center gap-2 bg-emerald hover:bg-emeraldHover text-white font-semibold py-3 px-5 rounded-full shadow-lg transition-transform hover:-translate-y-0.5">
            Ver catálogo de servicios
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M12 5v14M19 12l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>
      </section>

      <!-- Category Tabs -->
      <nav class="sticky top-[65px] z-30 bg-white border-b border-gray-200">
        <div id="category-tabs" class="flex gap-2 px-5 py-3 max-w-4xl mx-auto overflow-x-auto scrollbar-hide"></div>
      </nav>

      <!-- Catalog -->
      <section id="catalogo" class="px-5 py-8 pb-16 max-w-4xl mx-auto">
        <h2 class="text-xl font-bold text-gray-900 mb-1">Nuestros servicios</h2>
        <p class="text-sm text-gray-500 mb-5">Elige un servicio y agenda directo por WhatsApp.</p>
        <ul id="services-list" class="flex flex-col gap-3"></ul>
      </section>

      <!-- Sección Nosotros -->
      <section class="px-5 py-10 max-w-4xl mx-auto">
        <div class="flex flex-col md:flex-row gap-6 items-center">
          <div class="flex-1 order-2 md:order-1">
            <h2 class="text-xl font-bold text-gray-900 mb-3" data-nosotros-titulo></h2>
            <p class="text-sm text-gray-600 leading-relaxed" data-nosotros-descripcion></p>
          </div>
          <div class="w-full md:w-1/2 order-1 md:order-2">
            <img class="w-full h-48 md:h-56 object-cover rounded-xl shadow-md" data-nosotros-imagen alt="Sobre nosotros" />
          </div>
        </div>
      </section>

      <!-- Sección Ubicación -->
      <section class="px-5 py-10 max-w-4xl mx-auto">
        <h2 class="text-xl font-bold text-gray-900 mb-4" data-ubicacion-titulo></h2>
        <div class="rounded-xl shadow-lg overflow-hidden border border-gray-200">
          <iframe 
            class="w-full h-64 md:h-80 border-0"
            data-ubicacion-mapa
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
          ></iframe>
        </div>
      </section>

      <!-- Info Bar -->
      <section class="bg-navy text-white">
        <div class="px-5 py-8 max-w-4xl mx-auto">
          <h3 class="text-lg font-bold mb-4 text-center">Información de contacto</h3>
          <div class="flex flex-col sm:flex-row gap-6 justify-center items-center text-sm">
            <div class="flex items-center gap-3">
              <div class="flex items-center justify-center w-10 h-10 bg-white/10 rounded-full">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 1 1 16 0Z" stroke-linecap="round" stroke-linejoin="round" />
                  <circle cx="12" cy="10" r="3" />
                </svg>
              </div>
              <span data-direccion></span>
            </div>
            <div class="flex items-center gap-3">
              <div class="flex items-center justify-center w-10 h-10 bg-white/10 rounded-full">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="9" />
                  <path d="M12 7v5l3 3" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </div>
              <span data-horario></span>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Floating WhatsApp Button -->
    <a id="whatsapp-float" href="#" target="_blank" class="fixed bottom-5 right-5 z-50 flex items-center justify-center w-14 h-14 bg-emerald hover:bg-emeraldHover text-white rounded-full shadow-lg transition-transform hover:scale-105">
      <svg class="w-7 h-7 fill-current" viewBox="0 0 24 24">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.149-.15.297-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.05-.52-.099-.148-.669-1.611-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.095 3.2 5.076 4.487 2.981 1.287 2.981.857 3.522.803.54-.05 1.758-.718 2.006-1.413.248-.694.248-1.29.173-1.413-.074-.124-.272-.198-.57-.347z"/>
        <path d="M12.004 2C6.486 2 2 6.486 2 12.004c0 1.94.54 3.752 1.478 5.297L2.06 22l4.83-1.396a9.96 9.96 0 0 0 5.114 1.4c5.518 0 10.004-4.486 10.004-10.004C22.008 6.486 17.522 2 12.004 2zm0 18.163a8.13 8.13 0 0 1-4.15-1.14l-.298-.177-2.876.832.847-2.85-.194-.293a8.15 8.15 0 0 1-1.264-4.372c0-4.508 3.668-8.176 8.176-8.176 4.508 0 8.176 3.668 8.176 8.176 0 4.508-3.668 8.176-8.176 8.176z"/>
      </svg>
    </a>

    <!-- Lógica de la aplicación incrustada -->
    <script type="module">
      import { businessData } from "./js/data.js";

      const { general, categorias, servicios } = businessData;
      let categoriaActiva = "todos";

      function formatoPrecio(valor) {
        return new Intl.NumberFormat("es-MX", { style: "currency", currency: "MXN", minimumFractionDigits: 0 }).format(valor);
      }

      function mensajeWhatsApp(nombreServicio) {
        const texto = `¡Hola! Vi su página web y me gustaría recibir más información sobre ${nombreServicio}.`;
        return `https://wa.me/${general.whatsapp}?text=${encodeURIComponent(texto)}`;
      }

      function renderGeneral() {
        document.title = `${general.nombre} | ${general.eslogan}`;
        document.querySelectorAll("[data-nombre]").forEach(el => el.textContent = general.nombre);
        document.querySelectorAll("[data-eslogan]").forEach(el => el.textContent = general.eslogan);
        document.querySelectorAll("[data-direccion]").forEach(el => el.textContent = general.direccionCorta);
        document.querySelectorAll("[data-horario]").forEach(el => el.textContent = general.horario);
        document.querySelectorAll("[data-logo]").forEach(el => { el.src = general.logo; el.alt = `Logo ${general.nombre}`; });
        document.querySelectorAll("[data-hero-img]").forEach(el => { el.src = general.heroImagen; el.alt = `Hero ${general.nombre}`; });
        
        document.querySelectorAll("[data-nosotros-titulo]").forEach(el => el.textContent = general.nosotros.titulo);
        document.querySelectorAll("[data-nosotros-descripcion]").forEach(el => el.textContent = general.nosotros.descripcion);
        document.querySelectorAll("[data-nosotros-imagen]").forEach(el => { el.src = general.nosotros.imagen; el.alt = general.nosotros.titulo; });
        document.querySelectorAll("[data-ubicacion-titulo]").forEach(el => el.textContent = general.ubicacion.titulo);
        
        // Generar URL del mapa dinámicamente usando la dirección
        const mapaUrl = `https://www.google.com/maps?q=${encodeURIComponent(general.direccionCompleta)}&output=embed`;
        document.querySelectorAll("[data-ubicacion-mapa]").forEach(el => { el.src = mapaUrl; });
        
        // Actualizar meta tags de Open Graph
        document.querySelectorAll("[data-og-title]").forEach(el => el.setAttribute("content", general.nombre));
        document.querySelectorAll("[data-og-description]").forEach(el => el.setAttribute("content", general.eslogan));
        document.querySelectorAll("[data-og-image]").forEach(el => el.setAttribute("content", general.heroImagen));
        document.querySelectorAll("[data-og-url]").forEach(el => el.setAttribute("content", general.sitioUrl));
        document.querySelectorAll("[data-og-site-name]").forEach(el => el.setAttribute("content", general.nombre));
        
        // Actualizar meta tags de Twitter Card
        document.querySelectorAll("[data-twitter-title]").forEach(el => el.setAttribute("content", general.nombre));
        document.querySelectorAll("[data-twitter-description]").forEach(el => el.setAttribute("content", general.eslogan));
        document.querySelectorAll("[data-twitter-image]").forEach(el => el.setAttribute("content", general.heroImagen));
        
        const waFloat = document.getElementById("whatsapp-float");
        if (waFloat) waFloat.href = mensajeWhatsApp("sus servicios");
      }

      function renderTabs() {
        const tabsContainer = document.getElementById("category-tabs");
        if (!tabsContainer) return;

        tabsContainer.innerHTML = categorias.map(cat => {
          const isActive = cat.id === categoriaActiva;
          const classNames = isActive 
            ? "bg-navy text-white border-navy" 
            : "bg-bgAlt text-gray-500 border-gray-200 hover:border-navy hover:text-navy";
            
          return `
            <button class="shrink-0 text-sm font-semibold px-4 py-2 rounded-full border transition-colors whitespace-nowrap ${classNames}" data-categoria="${cat.id}">
              ${cat.nombre}
            </button>
          `;
        }).join("");

        tabsContainer.querySelectorAll("button").forEach(btn => {
          btn.addEventListener("click", () => {
            categoriaActiva = btn.dataset.categoria;
            renderTabs();
            renderServicios();
          });
        });
      }

      function renderServicios() {
        const lista = document.getElementById("services-list");
        if (!lista) return;

        const filtrados = categoriaActiva === "todos" ? servicios : servicios.filter(s => s.categoria === categoriaActiva);

        if (filtrados.length === 0) {
          lista.innerHTML = `<p class="text-gray-500 text-sm text-center py-8">No hay servicios en esta categoría todavía.</p>`;
          return;
        }

        lista.innerHTML = filtrados.map(servicio => `
          <li class="flex items-center gap-3.5 bg-bgAlt border border-gray-200 rounded-xl p-3 hover:shadow-sm hover:border-gray-300 transition-all">
            <img class="w-16 h-16 sm:w-18 sm:h-18 rounded-lg object-cover shrink-0" src="${servicio.imagen}" alt="${servicio.nombre}" loading="lazy" />
            <div class="flex-1 min-w-0">
              <h3 class="text-[0.95rem] font-bold text-gray-900 mb-0.5">${servicio.nombre}</h3>
              <p class="text-xs text-gray-500 mb-1.5 line-clamp-2">${servicio.descripcion}</p>
              <span class="text-sm font-bold text-navy">${formatoPrecio(servicio.precio)}</span>
            </div>
            <a href="${mensajeWhatsApp(servicio.nombre)}" target="_blank" class="shrink-0 flex items-center justify-center w-10 h-10 rounded-full bg-emerald hover:bg-emeraldHover transition-transform hover:scale-105">
              <svg class="w-5 h-5 fill-white" viewBox="0 0 24 24">
                <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.149-.15.297-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.05-.52-.099-.148-.669-1.611-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.095 3.2 5.076 4.487 2.981 1.287 2.981.857 3.522.803.54-.05 1.758-.718 2.006-1.413.248-.694.248-1.29.173-1.413-.074-.124-.272-.198-.57-.347z"/>
                <path d="M12.004 2C6.486 2 2 6.486 2 12.004c0 1.94.54 3.752 1.478 5.297L2.06 22l4.83-1.396a9.96 9.96 0 0 0 5.114 1.4c5.518 0 10.004-4.486 10.004-10.004C22.008 6.486 17.522 2 12.004 2zm0 18.163a8.13 8.13 0 0 1-4.15-1.14l-.298-.177-2.876.832.847-2.85-.194-.293a8.15 8.15 0 0 1-1.264-4.372c0-4.508 3.668-8.176 8.176-8.176 4.508 0 8.176 3.668 8.176 8.176 0 4.508-3.668 8.176-8.176 8.176z"/>
              </svg>
            </a>
          </li>
        `).join("");
      }

      function init() {
        renderGeneral();
        renderTabs();
        renderServicios();
        
        const btnScroll = document.getElementById("cta-scroll");
        if (btnScroll) {
          btnScroll.addEventListener("click", () => {
            document.getElementById("catalogo").scrollIntoView({ behavior: "smooth", block: "start" });
          });
        }
      }

      document.addEventListener("DOMContentLoaded", init);
    </script>
  </body>
</html>
